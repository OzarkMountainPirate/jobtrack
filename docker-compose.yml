name: jobtrack

services:
  bot:
    build: ./bot
    image: jobtrack/bot:local
    container_name: jobtrack-bot
    restart: unless-stopped
    # ./data on the host is owned by your user; run as that uid so the bind
    # mount stays writable. `id -u`:`id -g` if yours is not 1000.
    user: "1000:1000"
    env_file: .env
    volumes:
      - ./data:/data
    networks: [jobtrack]
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,os;sqlite3.connect(os.environ['JOBTRACK_DB']).execute('select 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Watches career pages that have no feed. AppliTrack and friends render their
  # postings table in JS, so this needs a real browser rather than plain HTTP.
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: jobtrack-changedetection
    restart: unless-stopped
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://sockpuppetbrowser:3000
      # The URL you reach the changedetection UI on, for links in its own pages.
      - BASE_URL=http://localhost:5000
    volumes:
      - ./changedetection:/datastore
    ports:
      - "5000:5000"
    networks: [jobtrack]
    depends_on: [sockpuppetbrowser]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  sockpuppetbrowser:
    image: dgtlmoon/sockpuppetbrowser:latest
    container_name: jobtrack-browser
    restart: unless-stopped
    cap_add: [SYS_ADMIN]          # chrome sandbox needs it
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - MAX_CONCURRENT_CHROME_PROCESSES=2
    networks: [jobtrack]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  jobtrack:
    name: jobtrack
